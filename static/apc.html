<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>APC Power Control | PDU Manager</title>
  <link rel="icon" type="image/x-icon" href="/static/images/rutomatrix.ico">
  
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background: #0A0C10;
      color: #E8EDFF;
      min-height: 100vh;
    }

    /* Header - Matching BMC style */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 28px;
      background: rgba(18, 22, 28, 0.85);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3), 0 1px 0 0 rgba(255, 255, 255, 0.05);
      position: fixed;
      top: 20px;
      left: 20px;
      right: 20px;
      z-index: 100;
      border: 1px solid rgba(255, 106, 0, 0.2);
    }

    .device-name {
      font-size: 1.2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #FF8C42, #FF6A00);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .device-name i {
      background: linear-gradient(135deg, #FF8C42, #FF6A00);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .status-badge {
      font-size: 0.7rem;
      background: rgba(255, 106, 0, 0.15);
      padding: 5px 12px;
      border-radius: 40px;
      color: #FF8C42;
      border: 1px solid rgba(255, 106, 0, 0.3);
    }

    /* Main Container */
    .container {
      padding: 20px;
      max-width: 1400px;
      margin: 100px auto 30px;
    }

    /* Credentials Card - Matching BMC style */
    .credentials-card {
      background: #0F1117;
      border-radius: 28px;
      padding: 28px 32px;
      margin-bottom: 28px;
      border: 1px solid rgba(255, 106, 0, 0.2);
      box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.4);
    }

    .card-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: linear-gradient(135deg, #FF8C42, #FF6A00);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .card-title i {
      color: #FF6A00;
      background: none;
      -webkit-background-clip: unset;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-group label {
      font-size: 0.8rem;
      font-weight: 500;
      color: #9AA4BF;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .input-group label i {
      color: #FF6A00;
      width: 18px;
    }

    .input-field {
      background: #0A0C12;
      border: 1px solid #2A2F3A;
      border-radius: 16px;
      padding: 12px 18px;
      color: #E8EDFF;
      font-size: 0.9rem;
      font-family: 'Inter', monospace;
      transition: all 0.2s;
      outline: none;
    }

    .input-field:focus {
      border-color: #FF6A00;
      box-shadow: 0 0 0 3px rgba(255, 106, 0, 0.2);
    }

    .input-field::placeholder {
      color: #4A5068;
    }

    /* Power Control Buttons */
    .power-controls {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 20px 0 10px;
    }

    .power-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 28px 48px;
      border-radius: 32px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border: none;
      min-width: 200px;
    }

    .power-btn i {
      font-size: 2.5rem;
    }

    .power-btn.on {
      background: linear-gradient(105deg, #FF6A00, #FF8C42);
      color: #0A0C10;
      box-shadow: 0 8px 28px rgba(255, 106, 0, 0.3);
    }

    .power-btn.on:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 35px rgba(255, 106, 0, 0.4);
    }

    .power-btn.off {
      background: linear-gradient(135deg, #D32F2F, #F44336);
      color: #fff;
      box-shadow: 0 8px 28px rgba(244, 67, 54, 0.3);
    }

    .power-btn.off:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 35px rgba(244, 67, 54, 0.4);
    }

    .power-btn:active {
      transform: translateY(1px);
    }

    .power-btn.disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* Status Panel - Matching BMC style */
    .status-panel {
      background: rgba(0, 0, 0, 0.4);
      border-radius: 20px;
      padding: 16px 24px;
      margin-top: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 15px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .connection-status {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
    }

    .connection-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #FF9800;
      transition: all 0.3s;
    }

    .connection-dot.connected {
      background: #4CAF50;
      box-shadow: 0 0 8px #4CAF50;
    }

    .connection-dot.error {
      background: #F44336;
    }

    .message-area {
      flex: 1;
      font-size: 0.85rem;
      color: #9AA4BF;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .message-area i {
      color: #FF6A00;
    }

    /* Modal - Matching BMC style */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      display: none;
      z-index: 1000;
      animation: fadeIn 0.2s ease;
    }

    .modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.95);
      width: 90vw;
      max-width: 450px;
      background: linear-gradient(135deg, #171B24 0%, #12141C 100%);
      border-radius: 28px;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 106, 0, 0.3);
      padding: 0;
      z-index: 1001;
      display: none;
      animation: modalSlideIn 0.25s ease;
      text-align: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes modalSlideIn {
      from {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.92);
      }
      to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    .modal-header {
      padding: 24px 24px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .modal-icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }

    .modal-icon.success { color: #4CAF50; }
    .modal-icon.error { color: #F44336; }
    .modal-icon.warning { color: #FF9800; }

    .modal-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .modal-message {
      padding: 16px 24px;
      font-size: 0.9rem;
      color: #B0B7D0;
      line-height: 1.5;
    }

    .modal-btn {
      background: linear-gradient(105deg, #FF6A00, #FF8C42);
      color: #0A0C10;
      border: none;
      padding: 12px 28px;
      font-weight: 600;
      border-radius: 40px;
      cursor: pointer;
      margin: 8px 24px 24px;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .modal-btn:hover {
      transform: scale(1.02);
      filter: brightness(1.05);
    }

    /* Loading spinner */
    .loading-spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 106, 0, 0.3);
      border-top-color: #FF6A00;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .header {
        padding: 10px 18px;
        top: 12px;
        left: 12px;
        right: 12px;
      }
      .device-name {
        font-size: 0.9rem;
      }
      .container {
        margin: 88px auto 20px;
        padding: 12px;
      }
      .credentials-card {
        padding: 20px;
      }
      .power-btn {
        padding: 20px 32px;
        min-width: 150px;
      }
      .power-btn i {
        font-size: 1.8rem;
      }
    }

    /* Outlet selector inline */
    .outlet-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 106, 0, 0.05);
      padding: 8px 16px;
      border-radius: 40px;
      border: 1px solid rgba(255, 106, 0, 0.2);
    }

    .outlet-wrapper label {
      font-size: 0.8rem;
      color: #FF8C42;
    }

    .outlet-input {
      width: 70px;
      background: #0A0C12;
      border: 1px solid #2A2F3A;
      border-radius: 12px;
      padding: 6px 10px;
      color: #E8EDFF;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
    }

    .outlet-input:focus {
      border-color: #FF6A00;
      outline: none;
    }
  </style>
</head>
<body>

<div class="header">
  <div class="device-name">
    <i class="fas fa-plug"></i>
    APC PDU Power Controller
  </div>
  <div class="status-badge">
    <i class="fas fa-shield-alt"></i> APC Switched Rack PDU
  </div>
</div>

<div class="container">
  <!-- Credentials Card -->
  <div class="credentials-card">
    <div class="card-title">
      <i class="fas fa-key"></i>
      PDU Authentication
    </div>
    <div class="form-grid">
      <div class="input-group">
        <label><i class="fas fa-network-wired"></i> IP Address</label>
        <input type="text" id="pduIp" class="input-field" placeholder="192.168.1.100" value="">
      </div>
      <div class="input-group">
        <label><i class="fas fa-user"></i> Username</label>
        <input type="text" id="pduUsername" class="input-field" placeholder="apc" value="apc">
      </div>
      <div class="input-group">
        <label><i class="fas fa-lock"></i> Password</label>
        <input type="password" id="pduPassword" class="input-field" placeholder="password" value="">
      </div>
      <div class="input-group">
        <label><i class="fas fa-plug"></i> Outlet Number</label>
        <input type="number" id="outletNumber" class="input-field" placeholder="1" value="1" min="1" max="16">
      </div>
    </div>
    <div class="status-panel">
      <div class="connection-status">
        <div class="connection-dot" id="connDot"></div>
        <span id="connText">Not configured</span>
      </div>
      <div class="message-area" id="statusMessage">
        <i class="fas fa-info-circle"></i>
        <span>Enter credentials and use power controls</span>
      </div>
    </div>
  </div>

  <!-- Power Control Buttons -->
  <div class="power-controls">
    <button class="power-btn on" id="powerOnBtn">
      <i class="fas fa-power-off"></i>
      <span>POWER ON</span>
      <small style="font-size: 0.7rem; opacity: 0.8;">olOn {outlet}</small>
    </button>
    <button class="power-btn off" id="powerOffBtn">
      <i class="fas fa-plug"></i>
      <span>POWER OFF</span>
      <small style="font-size: 0.7rem; opacity: 0.8;">olOff {outlet}</small>
    </button>
  </div>

  <!-- Info note -->
  <div style="text-align: center; margin-top: 24px; font-size: 0.7rem; color: #6A7085;">
    <i class="fas fa-terminal"></i> Commands: olOn &lt;outlet&gt; | olOff &lt;outlet&gt; via SSH
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay"></div>
<div class="modal" id="resultModal">
  <div class="modal-header">
    <div class="modal-icon" id="modalIcon">
      <i class="fas fa-check-circle"></i>
    </div>
    <div class="modal-title" id="modalTitle">Success</div>
  </div>
  <div class="modal-message" id="modalMessage">Operation completed successfully</div>
  <button class="modal-btn" id="closeModalBtn">OK</button>
</div>

<script src="scripts/config.js"></script>

<script>
  // DOM Elements
  const ipInput = document.getElementById('pduIp');
  const usernameInput = document.getElementById('pduUsername');
  const passwordInput = document.getElementById('pduPassword');
  const outletInput = document.getElementById('outletNumber');
  const powerOnBtn = document.getElementById('powerOnBtn');
  const powerOffBtn = document.getElementById('powerOffBtn');
  const connDot = document.getElementById('connDot');
  const connText = document.getElementById('connText');
  const statusMessageSpan = document.querySelector('#statusMessage span');
  const modalOverlay = document.getElementById('modalOverlay');
  const resultModal = document.getElementById('resultModal');
  const modalIcon = document.getElementById('modalIcon');
  const modalTitle = document.getElementById('modalTitle');
  const modalMessage = document.getElementById('modalMessage');
  const closeModalBtn = document.getElementById('closeModalBtn');

  // API Endpoints (from Python backend)
  const POWER_ON_URL = `http://${SERVER_CONFIG.ip}:1122/apc-power-on`;
  const POWER_OFF_URL = `http://${SERVER_CONFIG.ip}:1122/apc-power-off`;

  // Load saved credentials from localStorage
  function loadSavedCredentials() {
    const saved = localStorage.getItem('apc_pdu_creds');
    if (saved) {
      try {
        const creds = JSON.parse(saved);
        if (creds.ip) ipInput.value = creds.ip;
        if (creds.username) usernameInput.value = creds.username;
        if (creds.password) passwordInput.value = creds.password;
        if (creds.outlet) outletInput.value = creds.outlet;
      } catch(e) {}
    }
    updateConnectionStatus();
  }

  // Save credentials to localStorage
  function saveCredentials() {
    const creds = {
      ip: ipInput.value.trim(),
      username: usernameInput.value.trim(),
      password: passwordInput.value,
      outlet: outletInput.value
    };
    localStorage.setItem('apc_pdu_creds', JSON.stringify(creds));
    updateConnectionStatus();
  }

  // Update connection status display
  function updateConnectionStatus() {
    const ip = ipInput.value.trim();
    const username = usernameInput.value.trim();
    if (ip && username) {
      connDot.className = 'connection-dot connected';
      connText.textContent = `Ready: ${username}@${ip}`;
      statusMessageSpan.innerHTML = `Credentials saved. Click Power On/Off to control outlet ${outletInput.value}`;
    } else {
      connDot.className = 'connection-dot';
      connText.textContent = 'Enter IP and credentials';
      statusMessageSpan.innerHTML = 'Please enter PDU IP address, username, and password';
    }
  }

  // Show modal with result
  function showModal(type, title, message) {
    if (type === 'success') {
      modalIcon.innerHTML = '<i class="fas fa-check-circle"></i>';
      modalIcon.className = 'modal-icon success';
      modalTitle.textContent = title;
      modalTitle.style.color = '#4CAF50';
    } else if (type === 'error') {
      modalIcon.innerHTML = '<i class="fas fa-exclamation-triangle"></i>';
      modalIcon.className = 'modal-icon error';
      modalTitle.textContent = title;
      modalTitle.style.color = '#F44336';
    } else {
      modalIcon.innerHTML = '<i class="fas fa-info-circle"></i>';
      modalIcon.className = 'modal-icon warning';
      modalTitle.textContent = title;
      modalTitle.style.color = '#FF9800';
    }
    modalMessage.textContent = message;
    modalOverlay.style.display = 'block';
    resultModal.style.display = 'block';
  }

  function closeModal() {
    modalOverlay.style.display = 'none';
    resultModal.style.display = 'none';
  }

  // Set button loading state
  function setButtonLoading(button, isLoading) {
    if (isLoading) {
      button.disabled = true;
      button.classList.add('disabled');
      const originalContent = button.innerHTML;
      button.setAttribute('data-original', originalContent);
      button.innerHTML = `<span class="loading-spinner"> <span>Processing...</span>`;
    } else {
      button.disabled = false;
      button.classList.remove('disabled');
      const original = button.getAttribute('data-original');
      if (original) {
        button.innerHTML = original;
      } else {
        const isOn = button.id === 'powerOnBtn';
        button.innerHTML = isOn ? `<i class="fas fa-power-off"></i><span>POWER ON<small style="font-size:0.7rem;opacity:0.8;">olOn </span>${outletInput.value}</small>` : `<i class="fas fa-plug"></i><span>POWER OFF<small style="font-size:0.7rem;opacity:0.8;">olOff </span>${outletInput.value}</small>`;
      }
    }
  }

  // Update button labels when outlet changes
  function updateOutletLabels() {
    const outlet = outletInput.value;
    if (powerOnBtn.querySelector('small')) {
      powerOnBtn.querySelector('small').textContent = `olOn ${outlet}`;
      powerOffBtn.querySelector('small').textContent = `olOff ${outlet}`;
    }
  }

  // Call API for power operation
  async function powerOperation(action) {
    const ip = ipInput.value.trim();
    const username = usernameInput.value.trim();
    const password = passwordInput.value;
    const outlet = outletInput.value;

    // Validation
    if (!ip) {
      showModal('error', 'Missing IP', 'Please enter the PDU IP address');
      return false;
    }
    if (!username) {
      showModal('error', 'Missing Username', 'Please enter the SSH username');
      return false;
    }
    if (!password) {
      showModal('error', 'Missing Password', 'Please enter the SSH password');
      return false;
    }
    if (!outlet || outlet < 1) {
      showModal('error', 'Invalid Outlet', 'Please enter a valid outlet number (1-16)');
      return false;
    }

    // Save credentials on successful validation
    saveCredentials();

    const url = action === 'on' ? POWER_ON_URL : POWER_OFF_URL;
    const button = action === 'on' ? powerOnBtn : powerOffBtn;
    const actionName = action === 'on' ? 'Power ON' : 'Power OFF';

    setButtonLoading(button, true);
    
    // Update status message
    statusMessageSpan.innerHTML = `${actionName} command sent... waiting for response`;
    connDot.className = 'connection-dot';
    connText.textContent = `${actionName} in progress...`;

    try {
      const response = await fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          ip_address: ip,
          username: username,
          password: password,
          pdu_outlet_sut: outlet,
          pdu_type: 'apc'
        })
      });

      const data = await response.json();
      
      if (response.ok && (data.message || data.status === 200)) {
        const successMsg = data.message || `${actionName} completed successfully`;
        showModal('success', `${actionName} Success`, successMsg);
        statusMessageSpan.innerHTML = `${actionName} completed successfully`;
        connDot.className = 'connection-dot connected';
        connText.textContent = `Ready: ${username}@${ip}`;
        return true;
      } else {
        const errorMsg = data.error || data.message || `Failed to execute ${actionName}`;
        showModal('error', `${actionName} Failed`, errorMsg);
        statusMessageSpan.innerHTML = `${actionName} failed: ${errorMsg}`;
        connDot.className = 'connection-dot error';
        connText.textContent = `Error: ${errorMsg.substring(0, 50)}`;
        return false;
      }
    } catch (error) {
      console.error('API Error:', error);
      let errorDetail = error.message;
      if (error.message.includes('Failed to fetch')) {
        errorDetail = 'Cannot connect to API. Make sure the backend server is running.';
      }
      showModal('error', 'Connection Error', `Failed to connect: ${errorDetail}`);
      statusMessageSpan.innerHTML = `Connection error: ${errorDetail}`;
      connDot.className = 'connection-dot error';
      connText.textContent = 'API connection failed';
      return false;
    } finally {
      setButtonLoading(button, false);
    }
  }

  // Event Listeners
  powerOnBtn.addEventListener('click', () => powerOperation('on'));
  powerOffBtn.addEventListener('click', () => powerOperation('off'));
  closeModalBtn.addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', closeModal);
  
  // Auto-save on input change
  ipInput.addEventListener('change', saveCredentials);
  usernameInput.addEventListener('change', saveCredentials);
  passwordInput.addEventListener('change', saveCredentials);
  outletInput.addEventListener('change', () => {
    saveCredentials();
    updateOutletLabels();
  });
  
  outletInput.addEventListener('input', updateOutletLabels);

  // Also save when typing (debounced)
  let saveTimeout;
  function debouncedSave() {
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(saveCredentials, 500);
  }
  ipInput.addEventListener('input', debouncedSave);
  usernameInput.addEventListener('input', debouncedSave);
  passwordInput.addEventListener('input', debouncedSave);

  // Initialize
  loadSavedCredentials();
  updateOutletLabels();
  updateConnectionStatus();

  // Keyboard shortcut: Ctrl+Enter to send power on, Ctrl+Shift+Enter for power off
  window.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.key === 'Enter') {
      e.preventDefault();
      powerOperation('on');
    } else if (e.ctrlKey && e.shiftKey && e.key === 'Enter') {
      e.preventDefault();
      powerOperation('off');
    }
  });

  console.log('APC Power Controller UI Ready - Using BMC color scheme');
  console.log('API Endpoints: POST /apc-power-on, POST /apc-power-off');
</script>
</body>
</html>
